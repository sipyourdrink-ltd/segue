name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .claude-plugin/plugin.json
      - run: claude plugin validate .claude-plugin/marketplace.json
      - run: claude plugin test .
      - run: claude plugin validate plugins/rm-guard
      - run: claude plugin validate plugins/audit-log
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 plugins/rm-guard/tests/test_rm_guard.py
      - run: python3 plugins/audit-log/tests/test_audit_log.py
  codex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check codex/segue.mjs
      - run: node -e 'for (const f of ["plugin.json", "codex/hooks.json", ".agents/plugins/marketplace.json"]) JSON.parse(require("fs").readFileSync(f, "utf8"))'
      - run: node --test codex/segue.test.mjs
